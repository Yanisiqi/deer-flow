name: CD Demo - Package Helm Chart

on:
  push:
    tags:
      - 'cd-demo-*'

permissions:
  contents: read

jobs:
  package-chart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: '0.11.1'

      - name: Verify release version
        run: bash scripts/verify_versions.sh "${GITHUB_REF_NAME#cd-demo-}"

      - name: Validate and package Helm Chart
        run: |
          helm lint deploy/helm/deer-flow
          helm template deer-flow deploy/helm/deer-flow --include-crds >/dev/null
          helm package deploy/helm/deer-flow --destination packages

      - name: Upload Helm Chart to the workflow run
        uses: actions/upload-artifact@v4
        with:
          name: deer-flow-helm-chart
          path: packages/*.tgz
          if-no-files-found: error
          retention-days: 3
